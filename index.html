<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>BEAR JUMP - 自嘲熊跳跃</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        canvas {
            border: 4px solid #000;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div id="instructions">点击屏幕/按【空格键】跳跃 &nbsp;|&nbsp; 点击/按【ESC】暂停</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem('bearJumpHiScore') || 0;
        let isGameOver = false;
        let isPaused = false;
        let isTitleScreen = true;
        let gameSpeed = 2;
        let embarrassment = 3;
        let isInvincible = false;
        let invincibleTimer = 0;
        let screenFlash = 0;
        let dodgeStreak = 0;

        const bearImage = new Image();
        bearImage.src = 'picture/xiong2.jpg';

        const moleImage = new Image();
        moleImage.src = 'picture/shu.jpg';

        const bear = {
            x: 100,
            y: 300,
            width: 70,
            height: 70,
            dy: 0,
            gravity: 0.5,
            jumpPower: -16,
            isGrounded: true,
            hasDoubleJump: false,
            doubleJumpCount: 0,

            drawIdle() {
                if (isInvincible && Math.floor(invincibleTimer / 4) % 2 === 0) return;
                ctx.drawImage(bearImage, this.x, this.y, this.width, this.height);
                if (isInvincible) {
                    ctx.fillStyle = 'rgba(255, 150, 150, 0.6)';
                    ctx.beginPath();
                    ctx.arc(this.x + 15, this.y + 30, 8, 0, Math.PI * 2);
                    ctx.arc(this.x + 55, this.y + 30, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            },

            drawJumping() {
                if (isInvincible && Math.floor(invincibleTimer / 4) % 2 === 0) return;
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(-0.2);
                ctx.drawImage(bearImage, -this.width / 2, -this.height / 2, this.width, this.height);
                if (isInvincible) {
                    ctx.fillStyle = 'rgba(255, 150, 150, 0.6)';
                    ctx.beginPath();
                    ctx.arc(-15, -5, 8, 0, Math.PI * 2);
                    ctx.arc(15, -5, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            },

            drawDead() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(Math.PI / 2);
                ctx.drawImage(bearImage, -this.width / 2, -this.height / 2, this.width, this.height);
                ctx.restore();
            },

            draw() {
                if (isGameOver) {
                    this.drawDead();
                } else if (!this.isGrounded) {
                    this.drawJumping();
                } else {
                    this.drawIdle();
                }
            },

            update() {
                this.dy += this.gravity;
                this.y += this.dy;

                const groundLevel = 360 - this.height;
                if (this.y >= groundLevel) {
                    this.y = groundLevel;
                    this.dy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }
            },

            jump() {
                if (this.isGrounded) {
                    this.dy = this.jumpPower;
                    this.isGrounded = false;
                } else if (this.doubleJumpCount > 0) {
                    this.dy = this.jumpPower;
                    this.doubleJumpCount--;
                }
            }
        };

        const obstacles = [];
        const moles = [];
        const coffees = [];

        class Mole {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width;
                this.y = Math.random() * 150 + 150;
            }

            draw() {
                ctx.drawImage(moleImage, this.x, this.y, this.width, this.height);
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        class BrokenAlarm {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = canvas.width;
                this.y = 310;
                this.type = 'alarm';
            }

            draw() {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.fillStyle = '#fff';

                ctx.beginPath();
                ctx.roundRect(this.x + 5, this.y + 15, 40, 35, 5);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x + 10, this.y + 10, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x + 40, this.y + 10, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.x + 25, this.y + 5);
                ctx.lineTo(this.x + 20, this.y - 10);
                ctx.lineTo(this.x + 25, this.y - 5);
                ctx.lineTo(this.x + 30, this.y - 10);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x + 18, this.y + 32, 6, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(this.x + 24, this.y + 32);
                ctx.lineTo(this.x + 35, this.y + 28);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x + 35, this.y + 38, 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        class CoffeeCup {
            constructor() {
                this.width = 35;
                this.height = 45;
                this.x = canvas.width;
                this.y = Math.random() * 150 + 150;
                this.type = 'coffee';
            }

            draw() {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.fillStyle = '#fff';

                ctx.beginPath();
                ctx.moveTo(this.x + 6, this.y);
                ctx.lineTo(this.x + 8, this.y + 40);
                ctx.lineTo(this.x + 28, this.y + 40);
                ctx.lineTo(this.x + 30, this.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(this.x + 30, this.y + 8);
                ctx.quadraticCurveTo(this.x + 40, this.y + 12, this.x + 38, this.y + 22);
                ctx.quadraticCurveTo(this.x + 35, this.y + 30, this.x + 30, this.y + 28);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x + 12, this.y + 8, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 18, this.y + 8, 3, 0, Math.PI * 2);
                ctx.arc(this.x + 24, this.y + 8, 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        class DeadlinePapers {
            constructor() {
                this.width = 50;
                this.height = 55;
                this.x = canvas.width;
                this.y = 305;
                this.type = 'papers';
            }

            draw() {
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#000';
                ctx.fillStyle = '#fff';

                for (let i = 0; i < 4; i++) {
                    ctx.beginPath();
                    ctx.rect(this.x + 5 - i * 3, this.y + 10 + i * 8, 40 + i * 5, 45);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Comic Sans MS';
                ctx.textAlign = 'center';
                ctx.fillText('DEAD', this.x + 25, this.y + 35);
                ctx.fillText('LINE', this.x + 25, this.y + 48);
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        const clouds = [];
        class Cloud {
            constructor(x) {
                this.x = x || canvas.width + 50;
                this.y = Math.random() * 100 + 30;
                this.width = 80;
                this.speed = 1;
            }

            draw() {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#000';
                ctx.fillStyle = '#fff';

                ctx.beginPath();
                ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x + 25, this.y - 5, 25, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x + 55, this.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x + 35, this.y + 10, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            update() {
                this.x -= this.speed;
                if (this.x < -80) {
                    this.x = canvas.width + 50;
                    this.y = Math.random() * 100 + 30;
                }
            }
        }

        for (let i = 0; i < 3; i++) {
            clouds.push(new Cloud(i * 300));
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (isTitleScreen) {
                    isTitleScreen = false;
                    requestAnimationFrame(animate);
                } else if (isGameOver) {
                    resetGame();
                } else if (isPaused) {
                    isPaused = false;
                    requestAnimationFrame(animate);
                } else {
                    bear.jump();
                }
            } else if (e.code === 'Escape') {
                if (!isTitleScreen && !isGameOver) {
                    isPaused = !isPaused;
                    if (isPaused) {
                        drawPauseScreen();
                    } else {
                        requestAnimationFrame(animate);
                    }
                }
            }
        });

        canvas.addEventListener('click', (e) => {
            if (isTitleScreen) {
                isTitleScreen = false;
                requestAnimationFrame(animate);
            } else if (isGameOver) {
                resetGame();
            } else if (isPaused) {
                isPaused = false;
                requestAnimationFrame(animate);
            } else {
                bear.jump();
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isTitleScreen) {
                isTitleScreen = false;
                requestAnimationFrame(animate);
            } else if (isGameOver) {
                resetGame();
            } else if (isPaused) {
                isPaused = false;
                requestAnimationFrame(animate);
            } else {
                bear.jump();
            }
        });

        function resetGame() {
            obstacles.length = 0;
            moles.length = 0;
            coffees.length = 0;
            score = 0;
            frames = 0;
            gameSpeed = 2;
            embarrassment = 3;
            isInvincible = false;
            invincibleTimer = 0;
            screenFlash = 0;
            dodgeStreak = 0;
            isGameOver = false;
            bear.y = 300;
            bear.dy = 0;
            bear.hasDoubleJump = false;
            bear.doubleJumpCount = 0;
            requestAnimationFrame(animate);
        }

        function drawTitleScreen() {
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let c of clouds) {
                c.update();
                c.draw();
            }

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.fillStyle = '#000';
            ctx.font = 'bold 72px Comic Sans MS';
            ctx.textAlign = 'center';
            ctx.fillText('BEAR JUMP', canvas.width / 2, 160);

            ctx.strokeStyle = '#e74c3c';
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(canvas.width / 2 + 100, 130, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            bear.x = 370;
            bear.y = 280;
            bear.drawIdle();

            ctx.strokeStyle = '#000';
            ctx.fillStyle = '#000';
            ctx.font = 'bold 28px Comic Sans MS';
            ctx.fillText('按【空格键】开始', canvas.width / 2, 400);

            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(0, 380);
            ctx.lineTo(canvas.width, 380);
            ctx.stroke();
        }

        function animate() {
            if (isGameOver) return;
            if (isPaused) return;

            requestAnimationFrame(animate);

            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let c of clouds) {
                c.update();
                c.draw();
            }

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(0, 380);
            ctx.lineTo(canvas.width, 380);
            ctx.stroke();

            bear.update();
            bear.draw();

            if (isInvincible) {
                invincibleTimer--;
                if (invincibleTimer <= 0) {
                    isInvincible = false;
                }
            }

            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 0, 0, ${screenFlash / 30})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                screenFlash--;
            }

            handleObstacles();
            drawUI();

            frames++;
            if (frames % 600 === 0) gameSpeed += 0.3;
        }

        function handleObstacles() {
            const spawnRate = Math.max(70, 150 - Math.floor(frames / 400) * 10);
            if (frames % spawnRate === 0) {
                const rand = Math.random();
                if (rand < 0.5) {
                    obstacles.push(new BrokenAlarm());
                } else {
                    obstacles.push(new DeadlinePapers());
                }
            }

            if (frames % 300 === 0) {
                moles.push(new Mole());
            }

            if (frames % 350 === 0) {
                coffees.push(new CoffeeCup());
            }

            for (let i = 0; i < obstacles.length; i++) {
                let obs = obstacles[i];
                obs.update();
                obs.draw();

                const margin = 10;
                if (
                    bear.x + margin < obs.x + obs.width &&
                    bear.x + bear.width - margin > obs.x &&
                    bear.y + margin < obs.y + obs.height &&
                    bear.y + bear.height - margin > obs.y
                ) {
                    hitObstacle();
                    obstacles.splice(i, 1);
                    i--;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    i--;
                    score += 10;
                    dodgeStreak++;
                    if (dodgeStreak >= 5) {
                        dodgeStreak = 0;
                        if (embarrassment < 3) {
                            embarrassment++;
                        }
                    }
                }
            }

            for (let i = 0; i < moles.length; i++) {
                let mole = moles[i];
                mole.update();
                mole.draw();

                const margin = 5;
                if (
                    bear.x + margin < mole.x + mole.width &&
                    bear.x + bear.width - margin > mole.x &&
                    bear.y + margin < mole.y + mole.height &&
                    bear.y + bear.height - margin > mole.y
                ) {
                    bear.hasDoubleJump = true;
                    bear.doubleJumpCount++;
                    moles.splice(i, 1);
                    i--;
                }

                if (mole.x + mole.width < 0) {
                    moles.splice(i, 1);
                    i--;
                }
            }

            for (let i = 0; i < coffees.length; i++) {
                let coffee = coffees[i];
                coffee.update();
                coffee.draw();

                const margin = 5;
                if (
                    bear.x + margin < coffee.x + coffee.width &&
                    bear.x + bear.width - margin > coffee.x &&
                    bear.y + margin < coffee.y + coffee.height &&
                    bear.y + bear.height - margin > coffee.y
                ) {
                    if (embarrassment < 3) {
                        embarrassment++;
                    }
                    coffees.splice(i, 1);
                    i--;
                }

                if (coffee.x + coffee.width < 0) {
                    coffees.splice(i, 1);
                    i--;
                }
            }
        }

        function drawUI() {
            ctx.fillStyle = '#000';
            ctx.font = 'bold 24px Comic Sans MS';
            ctx.textAlign = 'right';
            ctx.fillText(`SCORE: ${String(score).padStart(5, '0')}`, canvas.width - 30, 50);
            ctx.fillText(`HI-SCORE: ${String(highScore).padStart(5, '0')}`, canvas.width - 30, 85);

            ctx.textAlign = 'left';
            ctx.fillText(`二段跳: x${bear.doubleJumpCount}`, 30, 50);

            ctx.font = 'bold 28px Comic Sans MS';
            let heartsStr = '';
            for (let i = 0; i < embarrassment; i++) {
                heartsStr += '❤️';
            }
            for (let i = embarrassment; i < 3; i++) {
                heartsStr += '🤍';
            }
            ctx.fillText(heartsStr, 30, 85);
        }

        function hitObstacle() {
            if (isInvincible) return;

            embarrassment--;
            screenFlash = 15;
            isInvincible = true;
            invincibleTimer = 60;
            dodgeStreak = 0;

            if (embarrassment <= 0) {
                triggerGameOver();
            }
        }

        function triggerGameOver() {
            isGameOver = true;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('bearJumpHiScore', highScore);
            }

            bear.draw();

            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.font = 'bold 56px Comic Sans MS';
            ctx.fillText('GAME OVER', canvas.width / 2, 180);

            ctx.font = 'bold 28px Comic Sans MS';
            ctx.fillText(`得分: ${score}`, canvas.width / 2, 240);

            ctx.strokeStyle = '#000';
            ctx.fillStyle = '#000';
            ctx.font = 'bold 26px Comic Sans MS';
            ctx.fillText('按【空格键】重新开始', canvas.width / 2, 310);

            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 380);
            ctx.lineTo(canvas.width, 380);
            ctx.stroke();
        }

        function drawPauseScreen() {
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.font = 'bold 56px Comic Sans MS';
            ctx.fillText('PAUSED', canvas.width / 2, 180);

            ctx.font = 'bold 28px Comic Sans MS';
            ctx.fillText(`当前得分: ${score}`, canvas.width / 2, 240);

            ctx.font = 'bold 26px Comic Sans MS';
            ctx.fillText('按【ESC】继续', canvas.width / 2, 310);
            ctx.fillText('按【空格键】重新开始', canvas.width / 2, 350);

            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 380);
            ctx.lineTo(canvas.width, 380);
            ctx.stroke();
        }

        drawTitleScreen();
    </script>
</body>
</html>
